<!doctype html>
<html lang="en">
<head>

  <title>Heavy pickup study</title>
  <style>
    * { box-sizing: border-box; } body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; color: #213b35; }

    nav { display: flex; gap: 16px; margin-bottom: 12px; } a { color: inherit; text-decoration: none; border-bottom: 1px solid #55776b; padding-bottom: 3px; }

</head>
